# On every push and pull request: install the locked environment, redraw every figure from the committed results, and
# run the tests. No secrets; read-only. Figures are compared byte for byte by the export's own check, so here a figure
# whose bytes differ (fonts and system libraries vary between machines) is not a failure.
name: reproduce
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0  # the tests compare files with the authors' earlier commits, so the submodule's full history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked --group dev
      - run: ALLOW_PNG_DRIFT=1 ./reproduce.sh
      - run: uv run --group dev pytest -q tests/
